[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/MakoStar/rust-pkg"
authors = ["MakoStar"]
description = "Reusable Rust utility crates."

[workspace.dependencies]
log = "0.4.34"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hex = "0.4.3"
md-5 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.8"

unicode-width = "0.2.2"
env_logger = "0.11"
chrono = "0.4"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }

url = "2.5.8"
bytes = "1.12.1"
thiserror = "2.0.20"
reqwest-retry = "0.9.1"
reqwest-middleware = "0.5.2"
reqwest = { version = "0.13.4", features = ["json", "multipart", "form", "query"] }
tokio = { version = "1.53.1", features = ["full"] }
